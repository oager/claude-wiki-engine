name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: pip install ruff pytest
      - name: Lint (ruff)
        run: ruff check .
      - name: Installer tests
        run: python -m unittest discover tests -v
      - name: Session tool tests (includes the leak-guard and publish tests)
        run: python -m pytest -p no:cacheprovider -q extra-tools/session/tests
      - name: Installer dry-run
        # Prints the plan and writes nothing; --into-repo keeps it off ~/.claude even if that ever regressed.
        run: python install.py --dry-run -y --into-repo "$(mktemp -d)"
      - name: Installer dry-run (session extras)
        # Also exercises preflight/sync's dependencies (extra-tools/session, handoff templates, the
        # session-handoff CLAUDE.md block) so a missing engine file fails CI, not a user's first install.
        run: python install.py --dry-run -y --into-repo "$(mktemp -d)" --extras preflight,sync
